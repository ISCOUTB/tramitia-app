name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compilar los modulos
        run: python -m compileall -q tramitia run.py

      - name: Suite de pruebas
        run: python -m unittest discover -s tests -t tests -v

  imagen:
    name: Imagen de contenedor
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t tramitia:ci .

      - name: Comprobar el arranque y el healthcheck
        run: |
          docker run -d --name tramitia-ci -p 5050:5050 tramitia:ci
          for intento in $(seq 1 15); do
            if curl -sf http://127.0.0.1:5050/health > /dev/null; then
              echo "el servicio responde"
              curl -s http://127.0.0.1:5050/health
              docker rm -f tramitia-ci
              exit 0
            fi
            sleep 2
          done
          echo "el servicio no respondio a tiempo"
          docker logs tramitia-ci
          docker rm -f tramitia-ci
          exit 1
